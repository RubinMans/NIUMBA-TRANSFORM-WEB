<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- NIUMBA TRANSFORM Official Logo - Square Version (compact for admin, cards) -->
  <defs>
    <linearGradient id="squareGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e4b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003319;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#squareGradient)"/>
  
  <!-- NT Monogram -->
  <text x="60" y="68" dominant-baseline="middle" text-anchor="middle" 
        font-family="Plus Jakarta Sans, Arial, Helvetica, sans-serif" 
        font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    NT
  </text>
</svg>