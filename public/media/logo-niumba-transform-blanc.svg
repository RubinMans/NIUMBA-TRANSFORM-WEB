<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- NIUMBA TRANSFORM Official Logo - White/Dark Version (for dark backgrounds) -->
  
  <!-- Main wordmark -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" 
        font-family="Plus Jakarta Sans, Arial, Helvetica, sans-serif" 
        font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    NIUMBA TRANSFORM
  </text>
  
  <!-- Tagline/brand -->
  <text x="50%" y="78%" dominant-baseline="middle" text-anchor="middle" 
        font-family="Plus Jakarta Sans, Arial, Helvetica, sans-serif" 
        font-size="14" font-weight="700" fill="#8af5b4" letter-spacing="0.28em" text-transform="uppercase">
    BUKHETE
  </text>
  
  <!-- Decorative element: beaker + gear -->
  <g transform="translate(200, 30) scale(0.8)">
    <!-- Beaker -->
    <path d="M-10 -10 L-10 5 Q-10 10 -5 10 L5 10 Q10 10 10 5 L10 -10 Z" 
          fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M-8 -5 L-8 0 Q-8 3 -5 3 L5 3 Q8 3 8 0 L8 -5" 
          fill="#ffffff" opacity="0.15"/>
    <!-- Gear -->
    <circle cx="0" cy="2" r="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M0 -6 L0 -8 M0 6 L0 8 M-6 0 L-8 0 M6 0 L8 0 M-5 -5 L-6 -6 M5 5 L6 6 M-5 5 L-6 6 M5 -5 L6 -6" 
          stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>